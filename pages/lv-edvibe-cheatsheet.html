<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Шпаргалка: Латышский язык (A1-A2)</title>

    <!-- Materialize CSS & Material Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        body {
            background-color: #f5f7fa;
            font-family: 'Roboto', sans-serif;
        }

        /* Закрепленная верхняя плашка */
        .sticky-nav {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
            height: auto !important;
        }

        nav.nav-extended {
            height: auto !important;
        }

        .nav-header {
            padding: 10px 12px 6px 12px;
            height: auto !important;
            line-height: normal !important;
        }

        .nav-container {
            width: 95%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 10px;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 500;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .subtitle-info {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.85);
            font-weight: normal;
            display: block;
            margin-top: 2px;
        }

        .nav-content {
            height: auto !important;
            position: relative !important;
        }

        /* Стили для табов */
        .tabs.tabs-transparent {
            display: flex;
            flex-wrap: wrap;
            height: auto;
            overflow-x: visible;
            gap: 6px 8px;
            padding: 4px 0 10px 0;
        }

        .tabs.tabs-transparent .tab {
            height: 36px;
            line-height: 36px;
            flex: 0 0 auto;
        }

        .tabs.tabs-transparent .tab a {
            display: inline-flex;
            align-items: center;
            padding: 0 12px;
            border-radius: 6px;
            font-size: 0.88rem;
            color: rgba(255, 255, 255, 0.88);
            background-color: rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease;
        }

        .tabs.tabs-transparent .tab a:hover {
            background-color: rgba(255, 255, 255, 0.25);
            color: #fff;
        }

        /* Активная вкладка */
        .tabs.tabs-transparent .tab a.active,
        .tabs.tabs-transparent .tab a.active:hover {
            background-color: #ff9800 !important;
            color: #ffffff !important;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        }

        .tabs.tabs-transparent .tab a i.material-icons {
            margin-right: 6px;
            font-size: 1.15rem;
            line-height: inherit;
        }

        .tabs .indicator {
            display: none !important;
        }

        .search-card {
            margin-top: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
        }

        .tab-content {
            padding-top: 10px;
            padding-bottom: 40px;
        }

        .word-badge {
            font-size: 1.05rem;
            font-weight: 600;
            color: #1a237e;
            cursor: pointer;
        }

        .antonym-divider {
            color: #e65100;
            font-weight: bold;
            font-size: 1.3rem;
            text-align: center;
        }

        .emoji-cell {
            font-size: 1.3rem;
            text-align: center;
            width: 40px;
        }

        .card-panel-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            color: #1a237e;
            font-weight: 500;
        }

        /* Таблица без деструктивного Materialize responsive-table */
        .vocab-table {
            width: 100%;
            border-collapse: collapse;
        }

        .vocab-table th {
            padding: 12px 10px;
        }

        .vocab-table td {
            padding: 10px 10px;
            vertical-align: middle;
        }

        .example-text {
            color: #555;
            font-style: italic;
            font-size: 0.92rem;
        }

        /* Мобильная адаптация: расположение элементов по строкам без горизонтального скролла */
        @media only screen and (max-width: 600px) {
            .nav-container {
                width: 100%;
                padding: 0 8px;
            }

            .brand-title {
                font-size: 1.05rem;
            }

            .subtitle-info {
                font-size: 0.78rem;
            }

            .tabs.tabs-transparent {
                gap: 4px;
            }

            .tabs.tabs-transparent .tab a {
                padding: 0 8px;
                font-size: 0.8rem;
            }

            /* Стандартные карточки слов на мобильном */
            .vocab-table.standard-table,
            .vocab-table.standard-table tbody,
            .vocab-table.standard-table tr,
            .vocab-table.standard-table td {
                display: block;
                width: 100%;
            }

            .vocab-table.standard-table thead {
                display: none;
            }

            .vocab-table.standard-table tr {
                margin-bottom: 10px;
                padding: 10px 12px;
                background: #fff;
                border-radius: 8px;
                border-left: 4px solid #3f51b5;
                box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            }

            .vocab-table.standard-table td {
                padding: 2px 0;
                border: none;
            }

            .vocab-table.standard-table td.emoji-cell {
                display: inline-block;
                width: auto;
                margin-right: 6px;
                font-size: 1.2rem;
            }

            .vocab-table.standard-table td.word-cell {
                display: inline;
            }

            .vocab-table.standard-table td.trans-cell {
                display: block;
                margin-top: 4px;
                font-size: 0.95rem;
                color: #333;
            }

            .vocab-table.standard-table td.example-cell {
                display: block;
                margin-top: 4px;
                padding-top: 4px;
                border-top: 1px dashed #e0e0e0 !important;
                font-size: 0.88rem;
            }

            /* Таблица антонимов на мобильном */
            .vocab-table.antonyms-table,
            .vocab-table.antonyms-table tbody,
            .vocab-table.antonyms-table tr,
            .vocab-table.antonyms-table td {
                display: block;
                width: 100%;
            }

            .vocab-table.antonyms-table thead {
                display: none;
            }

            .vocab-table.antonyms-table tr {
                margin-bottom: 12px;
                padding: 12px;
                background: #fff;
                border-radius: 8px;
                border-left: 4px solid #ff9800;
                box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            }

            .vocab-table.antonyms-table td {
                padding: 3px 0;
                border: none;
            }
        }
    </style>
</head>
<body>

<!-- Navigation Bar with Tabs -->
<nav class="nav-extended indigo darken-3 sticky-nav">
    <div class="nav-container">
        <div class="nav-header">
            <div class="brand-title">
                <i class="material-icons">translate</i>
                <span>Латышский язык - Шпаргалка из словаря Edvibe</span>
            </div>
            <span class="subtitle-info" id="module-info-text">(Загрузка данных...)</span>
        </div>
        <div class="nav-content">
            <ul class="tabs tabs-transparent" id="tabs-header-list">
                <!-- Вкладки генерируются динамически -->
            </ul>
        </div>
    </div>
</nav>

<div class="container">

    <!-- Search Input Bar -->
    <div class="card search-card z-depth-1">
        <div class="card-content" style="padding: 15px 20px;">
            <div class="input-field" style="margin: 0;">
                <i class="material-icons prefix color-indigo">search</i>
                <input id="word_search" onkeyup="filterWords()" placeholder="Быстрый поиск слова (на латышском или русском)..."
                       type="text">
            </div>
        </div>
    </div>

    <!-- Container for dynamic tab content -->
    <div id="tabs-content-container">
        <div class="center-align" style="padding: 40px;" id="loading-spinner">
            <div class="preloader-wrapper active">
                <div class="spinner-layer spinner-blue-only">
                    <div class="circle-clipper left"><div class="circle"></div></div>
                    <div class="gap-patch"><div class="circle"></div></div>
                    <div class="circle-clipper right"><div class="circle"></div></div>
                </div>
            </div>
            <p class="grey-text">Загрузка словаря...</p>
        </div>
    </div>

</div>

<!-- Materialize JavaScript CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

<script>
    let vocabularyData = null;

    function escapeHtml(str) {
        if (!str) return '';
        return str
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function initMaterializeComponents() {
        var tabs = document.querySelectorAll('.tabs');
        if (tabs.length > 0) {
            M.Tabs.init(tabs);
        }

        var tooltips = document.querySelectorAll('.tooltipped');
        if (tooltips.length > 0) {
            M.Tooltip.init(tooltips);
        }
    }

    async function loadVocabularyData() {
        try {
            const response = await fetch('lv-edvibe-data.json');
            if (!response.ok) {
                throw new Error('Не удалось загрузить данные JSON (' + response.status + ')');
            }
            vocabularyData = await response.json();
            renderHeaderInfo(vocabularyData);
            renderTabs(vocabularyData.tabs);
            initMaterializeComponents();
        } catch (error) {
            console.error('Ошибка загрузки JSON:', error);
            document.getElementById('tabs-content-container').innerHTML = `
                <div class="card-panel red lighten-4 red-text text-darken-4">
                    <i class="material-icons left">error</i>
                    <b>Ошибка загрузки данных:</b> ${escapeHtml(error.message)}.
                    Убедитесь, что файл <code>lv-edvibe-data.json</code> находится рядом с HTML страницей.
                </div>
            `;
        }
    }

    function renderHeaderInfo(data) {
        const infoElem = document.getElementById('module-info-text');
        if (infoElem) {
            let text = '';
            if (data.last_updated) {
                text += `Последнее обновление: ${escapeHtml(data.last_updated)}`;
            }
            if (data.module_info) {
                text += text ? `. ${escapeHtml(data.module_info)}` : escapeHtml(data.module_info);
            }
            infoElem.textContent = text;
        }
    }

    function renderTabs(tabs) {
        const navList = document.getElementById('tabs-header-list');
        const contentContainer = document.getElementById('tabs-content-container');

        let navHtml = '';
        let contentHtml = '';

        tabs.forEach((tab, index) => {
            const activeClass = index === 0 ? 'active' : '';
            navHtml += `
                <li class="tab">
                    <a class="${activeClass}" href="#${escapeHtml(tab.id)}">
                        <i class="material-icons left">${escapeHtml(tab.icon)}</i>${escapeHtml(tab.title)}
                    </a>
                </li>
            `;

            const displayTitle = tab.card_title || tab.title;

            contentHtml += `
                <div class="col s12 tab-content" id="${escapeHtml(tab.id)}">
                    <div class="card-panel white z-depth-1">
                        <h5 class="card-panel-title">
                            <i class="material-icons medium ${tab.type === 'antonyms' ? 'orange-text text-darken-2' : 'indigo-text'}">${escapeHtml(tab.icon)}</i>
                            ${escapeHtml(displayTitle)}
                        </h5>
                        ${tab.description ? `<p class="grey-text text-darken-1">${escapeHtml(tab.description)}</p>` : ''}
                        ${tab.type === 'antonyms' ? renderAntonymsTable(tab.items) : renderStandardTable(tab.items)}
                    </div>
                </div>
            `;
        });

        navList.innerHTML = navHtml;
        contentContainer.innerHTML = contentHtml;
    }

    function renderAntonymsTable(items) {
        let rowsHtml = '';
        items.forEach(item => {
            const tooltipA = item.example_a ? `data-position="top" data-tooltip="Пример: ${escapeHtml(item.example_a)}"` : '';
            const tooltipB = item.example_b ? `data-position="top" data-tooltip="Пример: ${escapeHtml(item.example_b)}"` : '';

            rowsHtml += `
                <tr>
                    <td class="emoji-cell">${escapeHtml(item.icon_a || '')}</td>
                    <td><span class="word-badge ${tooltipA ? 'tooltipped' : ''}" ${tooltipA}>${escapeHtml(item.word_a)}</span></td>
                    <td>${escapeHtml(item.translation_a)}</td>
                    <td class="antonym-divider center-align">↔</td>
                    <td class="emoji-cell">${escapeHtml(item.icon_b || '')}</td>
                    <td><span class="word-badge ${tooltipB ? 'tooltipped' : ''}" ${tooltipB}>${escapeHtml(item.word_b)}</span></td>
                    <td>${escapeHtml(item.translation_b)}</td>
                </tr>
            `;
        });

        return `
            <table class="highlight vocab-table antonyms-table striped">
                <thead>
                    <tr class="indigo lighten-5 indigo-text text-darken-4">
                        <th class="center-align">Иконка</th>
                        <th>Слово A (Латышский)</th>
                        <th>Перевод (Русский)</th>
                        <th class="center-align">VS</th>
                        <th class="center-align">Иконка</th>
                        <th>Слово B (Латышский)</th>
                        <th>Перевод (Русский)</th>
                    </tr>
                </thead>
                <tbody>
                    ${rowsHtml}
                </tbody>
            </table>
        `;
    }

    function renderStandardTable(items) {
        let rowsHtml = '';
        items.forEach(item => {
            const tooltip = item.example ? `data-position="top" data-tooltip="Пример: ${escapeHtml(item.example)}"` : '';

            rowsHtml += `
                <tr>
                    <td class="emoji-cell">${escapeHtml(item.icon || '')}</td>
                    <td class="word-cell"><span class="word-badge ${tooltip ? 'tooltipped' : ''}" ${tooltip}>${escapeHtml(item.word)}</span></td>
                    <td class="trans-cell">${escapeHtml(item.translation)}</td>
                    <td class="example-cell"><span class="example-text">${escapeHtml(item.example || '')}</span></td>
                </tr>
            `;
        });

        return `
            <table class="highlight vocab-table standard-table striped">
                <thead>
                    <tr class="indigo lighten-5 indigo-text text-darken-4">
                        <th class="center-align">Иконка</th>
                        <th>Латышский</th>
                        <th>Перевод</th>
                        <th>Пример</th>
                    </tr>
                </thead>
                <tbody>
                    ${rowsHtml}
                </tbody>
            </table>
        `;
    }

    // Функция универсального поиска по всем строкам таблиц
    function filterWords() {
        var input = document.getElementById('word_search');
        if (!input) return;
        var filter = input.value.toLowerCase();
        var rows = document.querySelectorAll('tbody tr');

        rows.forEach(function (row) {
            var text = row.textContent.toLowerCase();
            if (text.indexOf(filter) > -1) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
    }

    // Инициализация загрузки данных при старте
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        loadVocabularyData();
    } else {
        document.addEventListener('DOMContentLoaded', loadVocabularyData);
    }
</script>
</body>
</html>
